<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trần Quang Long - Student Supervisor & Applied Linguistics</title>
    <style>
      #particles-3d-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 3D Particle Background Canvas -->
    <canvas id="particles-3d-bg"></canvas>
    
    <div id="root"></div>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      (function() {
        const canvas = document.getElementById('particles-3d-bg');
        if (!canvas) return;

        // Set up Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          alpha: true,
          antialias: true
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Particle System
        const particleCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorSet = [
          new THREE.Color('#3b82f6'), // Blue neon
          new THREE.Color('#6366f1'), // Indigo neon
          new THREE.Color('#94a3b8')  // Silver/slate
        ];

        for (let i = 0; i < particleCount * 3; i += 3) {
          // Spread in a spherical/cloud structure
          positions[i] = (Math.random() - 0.5) * 800;     // X
          positions[i + 1] = (Math.random() - 0.5) * 800; // Y
          positions[i + 2] = (Math.random() - 0.5) * 800; // Z

          // Choose random neon color
          const chosenColor = colorSet[Math.floor(Math.random() * colorSet.length)];
          colors[i] = chosenColor.r;
          colors[i + 1] = chosenColor.g;
          colors[i + 2] = chosenColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Create texture for round particles (standard particle is a square)
        const createParticleTexture = () => {
          const matCanvas = document.createElement('canvas');
          matCanvas.width = 16;
          matCanvas.height = 16;
          const matCtx = matCanvas.getContext('2d');
          const gradient = matCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
          gradient.addColorStop(0, 'rgba(255,255,255,1)');
          gradient.addColorStop(1, 'rgba(255,255,255,0)');
          matCtx.fillStyle = gradient;
          matCtx.fillRect(0, 0, 16, 16);
          return new THREE.CanvasTexture(matCanvas);
        };

        const material = new THREE.PointsMaterial({
          size: 4,
          map: createParticleTexture(),
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          vertexColors: true
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Interaction state
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        const onMouseMove = (event) => {
          // Normalize mouse coordinates (-1 to 1)
          mouseX = (event.clientX - windowHalfX) * 0.05;
          mouseY = (event.clientY - windowHalfY) * 0.05;
        };

        const onTouchMove = (event) => {
          if (event.touches.length > 0) {
            mouseX = (event.touches[0].clientX - windowHalfX) * 0.05;
            mouseY = (event.touches[0].clientY - windowHalfY) * 0.05;
          }
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('touchmove', onTouchMove, { passive: true });

        // Auto Resize
        const onWindowResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onWindowResize, { passive: true });

        // Animation Loop
        const tick = () => {
          // Slow constant rotation
          particleSystem.rotation.y += 0.0008;
          particleSystem.rotation.x += 0.0003;

          // Parallax effect on mouse move with lerp for smoothness
          targetX += (mouseX - targetX) * 0.05;
          targetY += (mouseY - targetY) * 0.05;

          particleSystem.rotation.y += (targetX - particleSystem.rotation.y) * 0.01;
          particleSystem.rotation.x += (targetY - particleSystem.rotation.x) * 0.01;

          renderer.render(scene, camera);
          requestAnimationFrame(tick);
        };

        tick();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
